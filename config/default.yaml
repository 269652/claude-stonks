# LMTrade default configuration.
# Environment variables (LMTRADE_*) override anything set here.
# See .env.example for the full list.

mode: paper                # paper | live
budget: 100.0              # starting cash, account currency (paper default;
                           # ~1 EUR flat fees are a 10% drag at 10 EUR scale)
currency: EUR

universe:                  # A diversified, TR-realistic universe: US mega-caps,
                           # EU blue chips across several exchanges, broad
                           # ETFs, and crypto (24/7, keeps the feed live when
                           # every equity market is closed). This is NOT
                           # literally "everything on Trade Republic" — TR has
                           # no public catalog API, and most of its actual
                           # instrument count is leveraged warrants/knock-out
                           # certificates from partner banks that exist only
                           # inside TR's own app, with no accessible market
                           # data feed at all. What's listed here is what's
                           # both genuinely tradeable on TR AND has live data
                           # we can actually fetch (Yahoo Finance).
  # US equities
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - META
  - TSLA
  - JPM
  - V
  - JNJ
  # EU equities (Yahoo exchange suffixes: .DE Xetra, .PA Paris, .AS Amsterdam,
  # .SW Switzerland)
  - SAP.DE
  - SIE.DE
  - ALV.DE
  - DTE.DE
  - ASML.AS
  - MC.PA
  - OR.PA
  - AIR.PA
  - NESN.SW
  - NOVN.SW
  # ETFs
  - SPY
  - QQQ
  - IWM
  - GLD
  - EFA
  # Crypto (24/7)
  - BTC-USD
  - ETH-USD
  - SOL-USD
  - XRP-USD
  - ADA-USD

loop:
  interval_seconds: 45     # continuous intraday loop, ~once every 30-60s (TR
                           # can't do true HFT; sub-second execution is
                           # impossible via its API). Override with
                           # `lmtrade run --interval N` or config.toml.
  exit_check_seconds: 10   # re-check TP/SL/trailing of open positions this often
  max_positions: 2         # cap concurrent open positions — deliberately far
                           # below universe size; slots go to the strongest
                           # ranked signals across the whole universe each
                           # cycle, not first-come-first-served by list order
  stale_evict_enabled: true  # evict sideways positions that tie up capital
  stale_hours: 48            # minimum age (hours) before a position can be stale
  stale_max_profit_pct: 0.10 # evict if pnl% < 10 % — flat/losing but not yet at SL

model:
  stack: [heuristic, slm, perplexity]   # providers consulted, in order
  # Shown but not voting: 1-minute indicators (heuristic, slm) and duplicated
  # news reads (perplexity keyword scan, news sentiment — a veto instead).
  non_voting: [heuristic, slm, perplexity, news]
  slm_model: "qwen2.5:1.5b"             # T4-sized; use qwen2.5:7b on an A100
  cloud_model: "claude-haiku-4-5-20251001"
  perplexity_model: "sonar"
  weights:
    heuristic: 1.0
    slm: 1.0
    cloud: 1.5
    perplexity: 1.2
    strategy: 1.5          # the learned strategy genome's vote
    evidence: 2.0          # daily-bar evidence rules (strategies/evidence.py)
    claude_cli: 2.0        # LLM decision (model.decision_model, pre-screened + cached)
    news: 1.0              # hourly news sentiment vote
    analysis: 1.5          # daily Claude market-analysis bias

risk:
  max_position_fraction: 0.5
  stop_loss_pct: 0.05
  take_profit_pct: 0.08
  min_confidence: 0.55
  max_fee_pct: 0.01        # skip entries whose fee exceeds 1% of order value (0 = off)

options:                   # synthetic Black-Scholes options layer (paper)
  enabled: true
  atr_exits: true          # new positions: TP / SL at +3 / -2 x the underlying's daily ATR
  atr_tp_mult: 3.0
  atr_sl_mult: 2.0
  atr_window: 14
  expiry_days: 7
  max_option_fraction: 0.15  # max fraction of equity in one premium — lower
                             # than a small-universe default since up to
                             # max_positions can now fill concurrently
  take_profit_pct: 0.5       # +50% premium -> take profit
  stop_loss_pct: 0.4         # -40% premium -> cut
  trail_enabled: true        # trailing take-profit on net EUR profit (after both fees):
  trail_min_profit_eur: 20.0 #   arms at 20 / (1 - 0.15) = 23.53 EUR profit, then closes
  trail_pct: 0.15            #   15% below the peak profit — never below +20 EUR
  min_hours_to_expiry: 24    # force-close inside this window
  cash_reserve_pct: 0.40     # keep 40 % of net worth in cash; deploy the rest

entry:                     # watch-list entry timing (core/watchlist.py)
  watch_enabled: true      # signals wait for a better price instead of market entry
  require_daily_setup: true  # entries need the daily evidence rules to agree
  watch_k: 1.0             # enter at >= 1 sigma below (buy) / above (sell) the intraday SMA
  watch_window: 60         # bars used for that SMA / std (1m bars intraday)
  watch_max_hours: 4.0     # drop the watch entry if no good entry comes within this time
  limit_orders: true       # rest a limit order at the trigger price (exchange-side entry)
  reprice_drift: 0.005     # re-price the resting order when its target moves > 0.5%
  instant_confidence: 1.0  # signals at/above this skip the timing and enter right away
  instant_slippage: 0.005  # marketable-limit headroom for those instant entries
  market_above_sigma_pct: 1.0  # intraday sigma >= 1% of price: market order on trigger, no limit

learning:                  # evolutionary strategy optimizer
  enabled: false           # off: its genomes ran on 1-minute bars; to be rebuilt on daily
  population: 14           # ~2 genomes per family (7 families)
  epsilon: 0.2               # exploration rate
  mutation_scale: 0.3
  evolve_every_trades: 10

research:
  news_interval_minutes: 60          # hourly Perplexity news
  daily_analysis_interval_hours: 24  # daily Claude strategy review

benchmark:
  symbol: SPY              # "retail baseline": buy-and-hold SPY

budget_split:              # cash buckets, EUR: the rest of the cash is for new entries
  reserve_eur: 50          # never used by the bot (manual actions)
  dips_eur: 50             # only for dip buys into held positions

dips:                      # averaging down held positions on a dip
  enabled: true
  k_sigma: 1.5             # underlying this many sigma below the intraday SMA
  min_confidence: 0.6      # the fused signal must still back the position
  max_fee_pct: 0.03        # 1 EUR fee on a dip buy of >= ~34 EUR
  max_adds: 1              # per position
  min_barrier_distance: 0.10

signoff:                   # Claude reviews every automatic live order before it goes to TR
  enabled: true
  model: claude-opus-5-5
  timeout_seconds: 120

tr:                        # optional real-TR-instrument paper trading
  use_derivatives: true    # inert without TR_PHONE/TR_PIN in the env; when
                           # credentials are present, paper trading selects
                           # REAL TR knockout certificates (real ISINs) and
                           # marks them with the barrier-product model in
                           # finance/knockouts.py instead of synthetic options
  target_leverage: 5.0     # preferred KO leverage when picking an instrument

sizing:                    # quantitative sizing layer (public methods, no magic)
  kelly_enabled: true      # fractional Kelly from each genome's empirical edge
  kelly_fraction_of_full: 0.5   # half-Kelly: the practitioner standard
  kelly_min_trades: 5      # confidence sizing until a genome has this many
  vol_target_annual: 0.20  # volatility targeting: shrink size above this
  regime_filter_enabled: true   # vol-spike regime -> extra conviction, half size
  storm_extra_confidence: 0.10
  storm_size_factor: 0.5

economics:
  gpu_usd_per_hour: 0.20       # hourly cost of a rented GPU, if any (0 when running locally)
  min_runway_hours: 6
  inference_cost:
    slm: 0.0002
    cloud: 0.004
    perplexity: 0.005

web:
  host: "0.0.0.0"
  port: 8000

data:
  provider: auto             # auto | yahoo | synthetic (legacy "yfinance" name
                             # still accepted — see data/market.py)
  intraday: true             # 1m bars when the live Yahoo feed is available
